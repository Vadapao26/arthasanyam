name: Build Windows EXE, Portable Offline Bundle & Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows-and-offline:
    name: Build Windows App & Offline HTML
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle, single-file HTML & Windows EXE
        run: |
          npm run build
          node scripts/build-windows-exe.mjs

      - name: Upload Windows Desktop App & Offline Bundle
        uses: actions/upload-artifact@v4
        with:
          name: arthasanyam-windows-and-offline-bundle
          path: |
            Arthasanyam.exe
            arthasanyam-portable-offline.html
            Launch-Arthasanyam.bat
            dist/

  build-android-apk:
    name: Build Android APK (100% Offline Manifest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK Platform 36 & Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle & sync to Android project
        run: |
          npm run build
          npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: arthasanyam-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
